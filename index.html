    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .presentation {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .slide-frame {
            width: 1280px;
            height: 720px;
            border: none;
            position: absolute;
            opacity: 0;
            transform-origin: center center;
            transition: opacity 0.4s ease;
            pointer-events: none;
            background: #fff;
            will-change: transform, opacity;
        }
        .slide-frame.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* Navigation Controls */
        .nav-controls {
            position: fixed;
            bottom: clamp(12px, 2.5vmin, 24px);
            right: clamp(16px, 3vmin, 36px);
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.2vmin, 14px);
            z-index: 1000;
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }
        .nav-controls:hover {
            opacity: 0.08;
        }
        .nav-btn {
            width: clamp(32px, 4.5vmin, 46px);
            height: clamp(32px, 4.5vmin, 46px);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.65);
            background: rgba(0,0,0,0.35);
            color: #fff;
            font-size: clamp(12px, 1.8vmin, 18px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #fff;
            transform: scale(1.1);
        }
        .nav-btn:active {
            transform: scale(0.92);
        }
        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            transform: none !important;
        }
        .page-indicator {
            color: rgba(255,255,255,0.8);
            font-size: clamp(11px, 1.5vmin, 15px);
            font-family: 'Courier New', monospace;
            min-width: 45px;
            text-align: center;
            user-select: none;
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: clamp(2px, 0.4vmin, 4px);
            background: linear-gradient(90deg, #1284BA, #FF862F);
            transition: width 0.4s ease;
            z-index: 1000;
            opacity: 0.65;
            border-radius: 0 2px 2px 0;
        }

        /* Hint */
        .hint {
            position: fixed;
            bottom: clamp(12px, 2.5vmin, 24px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: clamp(10px, 1.4vmin, 14px);
            z-index: 999;
            pointer-events: none;
            transition: opacity 1.5s ease;
            white-space: nowrap;
        }

        /* Touch zones (invisible) */
        .touch-zone {
            position: fixed;
            top: 0;
            height: 100%;
            width: 20%;
            z-index: 100;
            cursor: pointer;
        }
        .touch-zone-left { left: 0; }
        .touch-zone-right { right: 0; }

        @media (max-width: 600px) {
            .hint { white-space: normal; text-align: center; max-width: 80vw; }
            .touch-zone { width: 30%; }
        }
    </style>
</head>

        // Set Chart.js defaults

        Chart.defaults.font.size = 12;
        Chart.defaults.color = '#666';

        // Project colors
        const projectColors = ['#1284BA', '#FF862F', '#4CAF50', '#9E9E9E'];

        // Project data
        const projects = [
            { name: '云犀 OS', commits: 336 },
            { name: '西邮智能体大赛', commits: 39 },
            { name: 'Vela-UI', commits: 10 },
            { name: '旧版云犀', commits: 7 }
        ];

        // Calculate effort data
        const totalCommits = projects.reduce((sum, p) => sum + p.commits, 0);
        const totalWorkDays = totalCommits / 3.16;

            const hours = Math.round((p.commits / totalCommits) * totalHours);
            const percentage = ((p.commits / totalCommits) * 100).toFixed(1);
            return {
                name: p.name,
                commits: p.commits,
                hours: hours,
                percentage: percentage,
                color: projectColors[i]
            };
        });

                    datalabels: {

                        align: 'top',
                        color: '#333',
                        font: { weight: 'bold', size: 14 },
                        formatter: (value) => value

                        beginAtZero: true,
                        grid: { color: '#eee', drawBorder: false },
                        ticks: { font: { size: 11 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 12 } }
                    }
                }
            }
        });

        // Effort Chart

            type: 'doughnut',
            data: {
                labels: effortData.map(p => p.name),
                datasets: [{
                    data: effortData.map(p => p.hours),
                    backgroundColor: projectColors,
                    borderColor: '#FFFFFF',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '60%', // Slightly larger cutout for smaller ring
                layout: {
                    padding: 10 // Padding inside chart
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 10,
                            usePointStyle: true,
                            font: { size: 10 },
                            boxWidth: 8 // Smaller legend marker
                        }
                    },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 10 },
                        formatter: (value, context) => {
                            const data = effortData[context.dataIndex];
                            if (parseFloat(data.percentage) > 5) {
                                return `${data.hours}h\n${data.percentage}%`;
                            }
                            return '';
                        },
                        textAlign: 'center'
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',

                                    `Commit: ${data.commits} 次`

                        }

    <script>
    (function() {
        var TOTAL = 9;
        var SLIDE_W = 1280;
        var SLIDE_H = 720;
        var currentSlide = -1;
        var touchStartX = 0;
        var touchStartY = 0;

        // Scale slides to fit viewport (contain strategy - no cropping)
        function resizeSlides() {
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            // Use min to ensure full slide is visible (letterbox if aspect differs)
            var scale = Math.min(vw / SLIDE_W, vh / SLIDE_H);
            var frames = document.querySelectorAll('.slide-frame');
            for (var i = 0; i < frames.length; i++) {
                frames[i].style.transform = 'scale(' + scale + ')';
            }
        }

        function init() {
            var container = document.getElementById('presentation');
            
            for (var i = 0; i < TOTAL; i++) {
                var iframe = document.createElement('iframe');
                iframe.className = 'slide-frame';
                iframe.id = 'slide-' + i;
                container.appendChild(iframe);

                var tpl = document.getElementById('slide-tpl-' + i);
                var html = tpl.innerHTML;
                html = html.split('<\\/script>').join('<' + '/script>');
                iframe.srcdoc = html;
            }

            resizeSlides();

            setTimeout(function() {
                currentSlide = 0;
                document.getElementById('slide-0').classList.add('active');
                updateUI();
            }, 150);

            setTimeout(function() {
                document.getElementById('hint').style.opacity = '0';
            }, 5000);
        }

        function goToSlide(index) {
            if (index < 0 || index >= TOTAL || index === currentSlide) return;
            var frames = document.querySelectorAll('.slide-frame');
            for (var i = 0; i < frames.length; i++) frames[i].classList.remove('active');
            document.getElementById('slide-' + index).classList.add('active');
            currentSlide = index;
            updateUI();
        }

        function nextSlide() { if (currentSlide < TOTAL - 1) goToSlide(currentSlide + 1); }
        function prevSlide() { if (currentSlide > 0) goToSlide(currentSlide - 1); }

        function updateUI() {
            document.getElementById('pageIndicator').textContent = (currentSlide + 1) + ' / ' + TOTAL;
            document.getElementById('prevBtn').disabled = (currentSlide <= 0);
            document.getElementById('nextBtn').disabled = (currentSlide >= TOTAL - 1);
            document.getElementById('progressBar').style.width = ((currentSlide + 1) / TOTAL * 100) + '%';
        }

        // Button events
        document.getElementById('prevBtn').addEventListener('click', function(e) { e.stopPropagation(); prevSlide(); });
        document.getElementById('nextBtn').addEventListener('click', function(e) { e.stopPropagation(); nextSlide(); });

        // Touch zones: left = prev, right = next
        document.getElementById('touchLeft').addEventListener('click', function(e) { e.stopPropagation(); prevSlide(); });
        document.getElementById('touchRight').addEventListener('click', function(e) { e.stopPropagation(); nextSlide(); });

        // Click on presentation area to advance
        document.getElementById('presentation').addEventListener('click', function() { nextSlide(); });

        // Touch swipe support
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            var dx = e.changedTouches[0].screenX - touchStartX;
            var dy = e.changedTouches[0].screenY - touchStartY;
            // Only trigger if horizontal swipe is dominant and long enough
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                if (dx < 0) nextSlide();
                else prevSlide();
            }
        }, { passive: true });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowRight': case 'ArrowDown': case ' ':
                    e.preventDefault(); nextSlide(); break;
                case 'ArrowLeft': case 'ArrowUp':
                    e.preventDefault(); prevSlide(); break;
                case 'Home':
                    e.preventDefault(); goToSlide(0); break;
                case 'End':
                    e.preventDefault(); goToSlide(TOTAL - 1); break;
                case 'f': case 'F':
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                    else document.exitFullscreen();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) document.exitFullscreen();
                    break;
            }
        });

        // Responsive resize with debounce
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeSlides, 60);
        });
        // Also handle orientation change on mobile
        window.addEventListener('orientationchange', function() {
            setTimeout(resizeSlides, 200);
        });

        // Auto fullscreen on first click
        var fsRequested = false;
        document.addEventListener('click', function() {
            if (!fsRequested && !document.fullscreenElement) {
                fsRequested = true;
                document.documentElement.requestFullscreen().catch(function(){});
            }
        });

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
