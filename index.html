  <div id="app"></div>

<script type="module">
  import kaomoji from "@/assets/data/kaomoji.json";
  console.log(kaomoji);
  
  function getRandomItem(arr) {
    const randomIndex = Math.floor(Math.random() * arr.length);
    return arr[randomIndex];
  }
  function setTitleWithEmoji(kaomojiSet) {
    document.title = "博乐科技" + getRandomItem(kaomojiSet);
  }
  document.addEventListener("DOMContentLoaded", function () {
    setTitleWithEmoji(kaomoji.happy);
    window.addEventListener("beforeunload", function (event) {
      setTitleWithEmoji(kaomoji.bye);
      const message = "要离开了吗？";
      event.returnValue = message;
      return message;
    });
    window.addEventListener("blur", function () {
      setTitleWithEmoji(kaomoji.sad);
    });
    window.addEventListener("focus", function () {
      setTitleWithEmoji(kaomoji.happy);
    });
  });
</script>
